image: node:18

stages:
  - build
  - deploy

variables:
  NODE_ENV: production

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/ # Cache dependencies to speed up builds

before_script:
  - echo "Installing dependencies..."
  - npm install --legacy-peer-deps

build:
  stage: build
  script:
    - echo "Building the project..."
    - npm run build
  artifacts:
    paths:
      - dist/ # Adjust to your actual build directory (e.g., 'build/' or 'out/')
    expire_in: 1 week
  only:
    - dev

deploy:
  stage: deploy
  script:
    - echo "Deploying to server..."
    - sudo systemctl restart omnichannel-crm-frontend-staging.service
  only:
    - dev
