image: node:18

stages:
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

before_script:
  - echo "Installing dependencies..."
  - npm install --force

build:
  stage: build
  script:
    - echo "Building the project..."
    - npm run build
  only:
    - dev

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$OMNICRM_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$OMNICRM_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - echo "Restarting service on the server..."
    - ssh "$OMNICRM_SERVER_USER@$OMNICRM_SERVER_IP" "sudo systemctl restart omnichannel-crm-frontend-staging.service"
  only:
    - dev