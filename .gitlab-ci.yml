image: node:18

stages:
  - build
  - deploy

before_script:
  - echo "Installing dependencies..."
  - npm install --force

build:
  stage: build
  script:
    - echo "Building the project..."
    - npm run build
  only:
    - dev

deploy:
  stage: deploy
  script:
    - echo "Deploying to server..."
    - sudo systemctl restart omnichannel-crm-frontend-staging.service
  only:
    - dev
