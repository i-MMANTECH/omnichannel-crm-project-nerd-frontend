image: node:18

stages:
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

before_script:
  - echo "Preparing for deployment..."

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$OMNICRM_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$OMNICRM_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - echo "Connecting to server and deploying..."
    - |
      ssh "$OMNICRM_SERVER_USER@$OMNICRM_SERVER_IP" "
        set -e
        echo 'Pulling latest code...'
        cd /root/omnichannel-crm/staging/newnativetalkcrm_frontend &&
        git pull https://$GITLAB_USERNAME:$GITLAB_TOKEN@gitlab.com/Jtobyy/new-nativetalk-crm-frontend.git dev &&
        echo 'Installing dependencies...' &&
        npm install --force &&
        echo 'Building project...' &&
        npm run build &&
        echo 'Restarting service...' &&
        sudo systemctl restart omnichannel-crm-frontend-staging.service
      "
  only:
    - dev
