name: CI - Code Quality Checks

# This runs whenever you create or update a Pull Request
on:
  pull_request:
    branches: [main, dev, preview]

jobs:
  check-code:
    name: Check Code Quality
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Step 4: Run linting (check code style)
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true  # Don't fail if there are lint warnings
      
      # Step 5: Try to build the project
      - name: Build project
        run: npm run build
        continue-on-error: true # Ignore errors and continue
        env:
          NEXT_PUBLIC_API_URL: https://dev-core.nativetalkcrm.com/api
          NEXT_PUBLIC_WS_BASE_URL: dev-core.nativetalkcrm.com