name: CI - Code Quality Checks

# This runs whenever you create or update a Pull Request
on:
  pull_request:
    branches: [main, dev, preview]

jobs:
  check-code:
    name: Check Code Quality
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Step 4: Run linting (check code style)
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true  # Don't fail if there are lint warnings
      
      # Step 5: Try to build the project
      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://dev-core.nativetalkcrm.com/api
          NEXT_PUBLIC_WS_URL: wss://ws-staging.example.com
      
      # Step 6: Check if build was successful
      - name: Verify build
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful!"
          else
            echo "❌ Build failed!"
            exit 1
          fi